name: Nightly Support Cleanup

on:
  schedule:
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch: {}

jobs:
  cleanup-test-only-tickets:
    runs-on: ubuntu-latest
    env:
      SUPPORT_API_TOKEN: ${{ secrets.SUPPORT_API_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_API_URL: ${{ github.api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run cleanup
        run: yarn cleanup:test-only-tickets
